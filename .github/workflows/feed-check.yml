name: feed-check

# Live check of the Local news feeds and searches against the real sites (the offline suite cannot reach
# them). Report only: a dead feed shows as FAIL in the run summary and never blocks a push.

on:
  push:
    paths:
      - agent_reach/daily/feeds.py
      - agent_reach/pipeline/local.py
      - tests/live_feeds.py
      - .github/workflows/feed-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Local candidates and searches
        run: python -m tests.live_feeds
      - name: Default Local feeds
        run: python -m tests.live_feeds --defaults
