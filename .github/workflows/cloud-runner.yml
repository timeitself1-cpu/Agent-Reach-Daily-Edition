name: cloud-runner

# Cloud takeover for Agent Reach: runs the full pipeline on a GitHub-hosted runner
# (Ollama + llama3.1:8b on CPU) and carries the SQLite velocity history between runs
# through the Actions cache.

on:
  workflow_dispatch:
    inputs:
      session_state_id:
        description: "Handoff session id (echoed into logs and the run summary)"
        required: false
        default: "manual"
      entrypoint:
        description: "Python module to run (agent_reach = classic report; agent_reach.daily = one Daily refresh + HTML export)"
        required: false
        default: "agent_reach"
      extra_args:
        description: "Extra CLI args, e.g. --top 10 --sources hackernews github"
        required: false
        default: ""
      no_llm:
        description: "Skip Ollama and use deterministic clustering"
        type: boolean
        required: false
        default: false
      daily_articles:
        description: "agent_reach.daily only: articles grouped and labelled (the CPU runner labels about 4 tokens/s)"
        required: false
        default: "80"
  repository_dispatch:
    types: [cloud-handoff]

concurrency:
  group: agent-reach-cloud-runner   # one run at a time so the SQLite history never forks
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODEL: llama3.1:8b
  EMBED_MODEL: nomic-embed-text
  SESSION_STATE_ID: ${{ github.event.inputs.session_state_id || github.event.client_payload.session_state_id || 'dispatch' }}
  ENTRYPOINT: ${{ github.event.inputs.entrypoint || github.event.client_payload.entrypoint || 'agent_reach' }}
  EXTRA_ARGS: ${{ github.event.inputs.extra_args || github.event.client_payload.extra_args || '' }}
  NO_LLM: ${{ github.event.inputs.no_llm || github.event.client_payload.no_llm || 'false' }}
  # Daily on this CPU-only runner: the Windows PC labels 260 articles in ~5 min; here 260 took >90 min
  # (run 37421270778: 14 label calls of 4-12 min each). A smaller budget and a longer limit fit the job.
  DAILY_ARTICLES: ${{ github.event.inputs.daily_articles || github.event.client_payload.daily_articles || '80' }}
  DAILY_MAX_RUN_MINUTES: "100"
  AGENT_REACH_DB_PATH: state/agent_reach.db
  AGENT_REACH_CONTACT_EMAIL: ${{ vars.AGENT_REACH_CONTACT_EMAIL || 'agent-reach@example.invalid' }}
  # CPU-only runner: give the 8B model room per call and bound the LLM workload
  AGENT_REACH_OLLAMA_TIMEOUT_S: "900"
  AGENT_REACH_MAX_ITEMS_FOR_LLM: "150"   # grouping is embedding-based; LLM only labels real clusters
  AGENT_REACH_LLM_MAX_RETRIES: "1"
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Session banner
        run: |
          echo "Agent Reach cloud handoff"
          echo "  session_state_id : $SESSION_STATE_ID"
          echo "  entrypoint       : $ENTRYPOINT"
          echo "  extra_args       : $EXTRA_ARGS"
          echo "  no_llm           : $NO_LLM"
          echo "  commit           : $GITHUB_SHA"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore velocity history (SQLite)
        uses: actions/cache/restore@v5
        with:
          path: state
          key: agent-reach-db-${{ github.run_id }}
          restore-keys: agent-reach-db-

      - name: Restore Ollama model cache
        if: env.NO_LLM != 'true'
        id: model-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.ollama/models
          key: ollama-models-llama3.1-8b-nomic-embed-text

      - name: Install and start Ollama
        if: env.NO_LLM != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$HOME/.ollama/models"
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null || { cat "$RUNNER_TEMP/ollama.log"; exit 1; }
          OLLAMA_MODELS="$HOME/.ollama/models" ollama pull "$MODEL"
          OLLAMA_MODELS="$HOME/.ollama/models" ollama pull "$EMBED_MODEL"
          ollama list

      - name: Save Ollama model cache
        if: env.NO_LLM != 'true' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.ollama/models
          key: ollama-models-llama3.1-8b-nomic-embed-text

      - name: Run Agent Reach
        run: |
          mkdir -p state reports
          if [ "$ENTRYPOINT" = "agent_reach.daily" ]; then
            # Agent Reach Daily: one real refresh through the same code path as the Windows app,
            # then the edition as HTML plus the Daily logs. The data folder lives under state/ so
            # the next run has history (what changed, momentum).
            export AGENT_REACH_DAILY_HOME="$PWD/state/daily"
            # The Daily app reads its budget from settings.json (AGENT_REACH_MAX_ITEMS_FOR_LLM does not
            # apply to it): write this runner's own settings; the Windows defaults stay unchanged.
            python - <<'PY'
          import os
          from agent_reach.daily.paths import DataPaths
          from agent_reach.daily.prefs import load_prefs, save_prefs
          paths = DataPaths.resolve().ensure()
          prefs, _ = load_prefs(paths)
          prefs.max_items_for_llm = int(os.environ["DAILY_ARTICLES"])
          prefs.max_run_minutes = float(os.environ["DAILY_MAX_RUN_MINUTES"])
          prefs.podcast_auto = False  # no speech engine on the runner
          save_prefs(paths, prefs)
          print(f"cloud runner settings: {prefs.max_items_for_llm} articles, {prefs.max_run_minutes:g} min limit")
          PY
            # shellcheck disable=SC2206
            EXTRA=($EXTRA_ARGS)
            set +e
            python -u -m agent_reach.daily --refresh-now --trigger manual --log-level INFO "${EXTRA[@]}" \
              2> >(tee reports/pipeline.log >&2) | tee reports/report.txt
            rc=${PIPESTATUS[0]}
            python -m agent_reach.daily --export-html "reports/edition-${GITHUB_RUN_ID}.html"
            python -m agent_reach.daily --status > reports/status.json
            cp -r "$AGENT_REACH_DAILY_HOME/logs" reports/daily-logs
            cp -r "$AGENT_REACH_DAILY_HOME/diagnostics" reports/daily-diagnostics 2>/dev/null
            echo "agent_reach.daily exit code: $rc"
            exit "$rc"
          fi
          ARGS=(--json-out "reports/report-${GITHUB_RUN_ID}.json" --log-level INFO)
          if [ "$NO_LLM" = "true" ]; then ARGS+=(--no-llm); fi
          # shellcheck disable=SC2206
          EXTRA=($EXTRA_ARGS)
          set -o pipefail
          # stderr (all progress logs) streams live to the job log AND is saved to pipeline.log;
          # stdout (the final executive report) goes to the log and report.txt
          python -u -m "$ENTRYPOINT" "${ARGS[@]}" "${EXTRA[@]}" \
            2> >(tee reports/pipeline.log >&2) | tee reports/report.txt

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## Agent Reach cloud run"
            echo ""
            echo "- Session: \`$SESSION_STATE_ID\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo ""
            echo '```text'
            if [ -f reports/report.txt ]; then cat reports/report.txt; else echo "no report produced"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save velocity history (SQLite)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state
          key: agent-reach-db-${{ github.run_id }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-reach-report-${{ github.run_id }}
          path: |
            reports/
            ${{ runner.temp }}/ollama.log
          if-no-files-found: warn
          retention-days: 14
