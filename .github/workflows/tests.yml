name: tests

# Offline test suite and lint on every push and pull request. No Ollama or live
# data: the suite uses mock HTTP and a fake Ollama (tests/fakes.py, tests/daily_fakes.py).
# Tk window tests run on a virtual display (Xvfb).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: pyflakes
        run: python -m pyflakes agent_reach tests

      - name: pytest (window tests on Xvfb)
        run: xvfb-run -a python -m pytest -rs

      - name: Offline reliability replay
        run: python -m tests.replay_benchmark

      - name: CLI smoke test
        run: python -m agent_reach --no-llm --help

      - name: Self-test harness dry run (fake world)
        run: xvfb-run -a python -m tests.daily_selftest --world --skip-pytest --quick --out "$RUNNER_TEMP"

      - name: Daily CLI smoke test
        run: |
          python -m agent_reach.daily --version
          python -m agent_reach.daily --help
          python -m agent_reach.daily --install-task --dry-run --data-dir "$RUNNER_TEMP/agent reach daily"
